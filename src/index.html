<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tapkin</title>
  </head>
  <body>
    <main id="app"><img id="pet" alt="Tapkin desktop companion" draggable="false" /></main>
    <main id="settings">
      <header><div class="brand">Tapkin <span>v1.0</span></div><p>A tiny companion for your typing days.</p></header>
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="warning" class="notice" role="status" hidden></div>
      <section class="skin-card">
        <img id="preview" alt="Current skin preview" draggable="false" />
        <div><h1 id="skin-name">Loading skin…</h1><p id="skin-path" class="path"></p><button id="choose-skin" class="primary">Choose skin folder…</button></div>
      </section>
      <div class="skin-actions"><button id="reload">Reload skin</button><button id="open-folder">Open skin folder</button></div>
      <section>
        <h2>Desktop</h2>
        <label class="size-label" for="width">Size <output id="size-value">240 × 240 px</output></label>
        <input id="width" type="range" min="64" max="800" step="1" value="240" />
        <label class="toggle"><span>Always on top</span><input id="always_on_top" type="checkbox" /></label>
        <label class="toggle"><span>Click through<small>Turn off again from the tray menu.</small></span><input id="click_through" type="checkbox" /></label>
        <label class="toggle"><span>Lock position</span><input id="lock_position" type="checkbox" /></label>
        <label class="toggle"><span>Launch at login</span><input id="launch_at_login" type="checkbox" /></label>
      </section>
      <section class="listener">
        <h2 id="input-status">Starting listener…</h2>
        <p id="permission-message"></p>
        <button id="retry">Retry listener</button>
        <div id="mac-permissions" hidden><button id="input-permission">Input Monitoring settings</button><button id="accessibility-permission">Accessibility settings</button></div>
      </section>
      <section id="local-test" hidden><p>Local animation test (development only)</p><button id="test-input">Focus here, then press keys</button><p>When the global listener is inactive, this sends only a typing signal.</p></section>
      <footer><span>Local. Private. No accounts.</span><button id="quit">Quit Tapkin</button></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
