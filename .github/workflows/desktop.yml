name: Desktop checks and installers

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            artifact: tapkin-macos
          - os: windows-latest
            bundles: nsis
            artifact: tapkin-windows
          - os: ubuntu-22.04
            bundles: deb
            artifact: tapkin-linux-deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm ci
      - run: pnpm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: pnpm run tauri build --bundles ${{ matrix.bundles }}
      - name: Package Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = "src-tauri/target/release/portable"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item "src-tauri/target/release/tapkin.exe" "$portable/Tapkin.exe"
          Copy-Item "LICENSE" "$portable/LICENSE"
          @"
          Extract this archive and run Tapkin.exe. No Tapkin installation is required.
          Microsoft Edge WebView2 Runtime must already be installed.
          Settings and skins are stored in the normal per-user application data directory,
          not beside the executable. This is an installation-free build, not isolated storage.
          "@ | Set-Content "$portable/README.txt"
          Compress-Archive -Path "$portable/*" -DestinationPath "src-tauri/target/release/tapkin-windows-portable.zip" -Force
      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tapkin-windows-portable
          path: src-tauri/target/release/tapkin-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
